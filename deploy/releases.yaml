AWSTemplateFormatVersion: "2010-09-09"
Description: seshka downloads. A private bucket behind CloudFront for the disk image, the update archives and the update feed.
# Releases are uploaded from the machine that holds the signing keys, with that person's own AWS credentials,
# so there is no upload role here.
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub seshka-releases-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub seshka-releases-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: seshka downloads
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: releases
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: releases
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed "CachingOptimized": archives are versioned; the feed and the disk image are uploaded with no-cache.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
Outputs:
  Bucket: { Value: !Ref Bucket }
  DownloadsUrl: { Value: !Sub "https://${Distribution.DomainName}" }
  DistributionId: { Value: !Ref Distribution }
